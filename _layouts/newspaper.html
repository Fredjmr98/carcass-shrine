---
layout: base
---
<a class="back" href="{{ '/' | relative_url }}">← archivo</a>
<article class="sheet">
<div class="top"><span>N.º {{ page.issue }}</span><span>{{ page.date_text }}</span><span>{{ page.year }}</span></div>
<header class="mast"><h1>{{ page.paper | default: "La Gaceta" }}</h1><p class="tag">{{ page.tagline }}</p></header>
<div class="boxes">{% for b in page.info %}<div>{{ b }}</div>{% endfor %}</div>
<div class="cols"><h2 class="headline">{{ page.title }}</h2>
{{ content }}</div>
</article>
